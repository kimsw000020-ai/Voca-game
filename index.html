<!DOCTYPE html>

        .btn-review-modal { background-color: #34495e; color: white; border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; }

        .score-text { color: #e74c3c; }

        .card { background-color: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: center; margin-bottom: 15px; border: 1px solid #dcdde1; }
        .word-display { font-size: 32px; font-weight: bold; margin-bottom: 20px; word-break: keep-all; min-height: 40px; }
        
        .btn-group { display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; }
        button { cursor: pointer; border: none; border-radius: 8px; padding: 10px 15px; font-size: 14px; font-weight: bold; transition: 0.2s; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .btn-speak { background-color: #e0f7fa; color: #0984e3; }
        .btn-save { background-color: #fff3e0; color: #f39c12; }
        
        .feedback { text-align: center; font-size: 18px; font-weight: bold; min-height: 25px; margin-bottom: 10px; }
        
        .example-area { background-color: #f8f9fa; padding: 15px; border-radius: 8px; font-size: 13px; color: #34495e; text-align: left; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; border: 1px solid #eee;}
        .example-text { flex: 1; line-height: 1.4;}
        .example-actions { display: flex; gap: 10px; justify-content: flex-end; }
        .btn-icon { background: #ecf0f1; font-size: 18px; padding: 8px 12px; border-radius: 50%; color: #2c3e50;}
        
        /* 4지 선다 모드 */
        .options { display: flex; flex-direction: column; gap: 10px; }
        .btn-option { background-color: white; border: 1px solid #bdc3c7; padding: 15px; font-size: 16px; color: #2f3640; border-radius: 10px; }
        .btn-option:hover:not(:disabled) { background-color: #ecf0f1; }
        .btn-option.correct { background-color: #badc58 !important; color: white; border-color: #badc58; }
        .btn-option.wrong { background-color: #ff7979 !important; color: white; border-color: #ff7979; }
        
        /* 직접 입력(주관식) 모드 */
        .typing-container { display: none; flex-direction: column; gap: 10px; }
        .type-input { padding: 15px; font-size: 18px; border: 2px solid #bdc3c7; border-radius: 10px; text-align: center; font-weight: bold; outline: none; }
        .type-input:focus { border-color: #8e44ad; }
        .type-input.correct { background-color: #dff9fb; border-color: #badc58; color: #27ae60; }
        .type-input.wrong { background-color: #ffefef; border-color: #ff7979; color: #c0392b; }
        .btn-submit { background-color: #3498db; color: white; padding: 15px; font-size: 16px; border-radius: 10px; }

        .btn-next { background-color: #2ecc71; color: white; width: 100%; padding: 15px; font-size: 18px; border-radius: 10px; margin-top: 15px; display: none; }
        .btn-restart { background-color: #8e44ad; color: white; width: 100%; padding: 15px; font-size: 18px; border-radius: 10px; margin-top: 15px; display: none; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; box-sizing: border-box;}
        .modal-content { background: white; width: 100%; max-width: 400px; border-radius: 12px; padding: 20px; max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(0,0,0,0.2);}
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 2px solid #f0f2f5; padding-bottom: 10px;}
        .modal-title { font-size: 18px; font-weight: bold; margin: 0; color: #e74c3c; }
        .btn-close-modal { background: none; border: none; font-size: 24px; cursor: pointer; color: #7f8c8d; padding: 0; }
        
        .modal-action-bar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; margin-bottom: 5px; border-bottom: 1px dashed #dcdde1; }
        .review-count { font-size: 14px; font-weight: bold; color: #34495e; }
        .btn-start-review-test { background-color: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; display: none; }

        .review-list { overflow-y: auto; flex: 1; padding-right: 5px; }
        .review-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f0f2f5; }

    </style>
</head>

<div class="app-container">
    <div class="header-top">
        <h1 class="app-title">Master Voca</h1>
        <button class="btn-review-modal" onclick="openReviewModal()">📝 오답 노트</button>
    </div>

    <div class="controls">
        <select id="daySelect">
            <option value="전체 랜덤">전체 랜덤</option>
            <option value="DAY 20">DAY 20</option>
            <option value="DAY 19">DAY 19</option>
            <option value="DAY 18">DAY 18</option>
            <option value="DAY 17">DAY 17</option>
            <option value="DAY 16">DAY 16</option>
        </select>
        <select id="modeSelect">
            <option value="en2ko">영어 ➔ 한글 (선택)</option>
            <option value="ko2en">한글 ➔ 영어 (선택)</option>
            <option value="ko2en_type">한글 ➔ 영어 (직접 입력)</option>
        </select>
    </div>

    <div class="score-board">
        <span id="progressText">진행: 0 / 0</span>
        <span id="remainText">남은 단어: 0</span>
        <span class="score-text" id="scoreText">점수: 0</span>
    </div>

        <div class="btn-group">
            <button class="btn-speak" id="speakBtn">🔊 단어 듣기</button>
            <button class="btn-save" id="saveBtn">⭐ 오답 저장</button>
        </div>
    </div>

    <div class="feedback" id="feedbackLabel"></div>
    
    <div class="example-area" id="exampleArea" style="display: none;">
        <div class="example-text" id="exampleText"></div>
        <div class="example-actions">
            <button class="btn-icon" id="speakExBtn" title="예문 듣기">🗣</button>
            <button class="btn-icon" id="shadowBtn" title="쉐도잉 (마이크)">🎙</button>
        </div>
    </div>

    <div class="options" id="optionsContainer">
        <button class="btn-option" onclick="checkAnswerChoice(this)"></button>
        <button class="btn-option" onclick="checkAnswerChoice(this)"></button>
        <button class="btn-option" onclick="checkAnswerChoice(this)"></button>
        <button class="btn-option" onclick="checkAnswerChoice(this)"></button>
    </div>

    <div class="typing-container" id="typingContainer">
        <input type="text" id="typeInput" class="type-input" placeholder="영어 스펠링을 입력하세요" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button class="btn-submit" id="typeSubmitBtn" onclick="checkAnswerTyping()">정답 확인</button>
    </div>

    <button class="btn-next" id="nextBtn" onclick="nextQuestion()">다음 문제 ➔</button>
    <button class="btn-restart" id="restartBtn" onclick="resetAndLoad()">다시 풀기 ↺</button>
</div>

<div class="modal-overlay" id="reviewModal">

        <div class="modal-header">

        </div>
        <div class="review-list" id="reviewList">

    </div>
</div>

    let sessionQueue = []; 
    let totalSessionWords = 0;
    let completedWords = 0;
    let currentWord = null;
    let currentAnswer = "";
    let currentExampleEng = "";
    let score = 0;
    let isQuestionResolved = false; 
    let isReviewTestMode = false; // 현재 오답 테스트 모드인지 여부
    
    // DOM 요소
    const daySelect = document.getElementById('daySelect');
    const modeSelect = document.getElementById('modeSelect');
    const progressText = document.getElementById('progressText');
    const remainText = document.getElementById('remainText');
    const scoreText = document.getElementById('scoreText');
    const questionLabel = document.getElementById('questionLabel');
    const feedbackLabel = document.getElementById('feedbackLabel');
    const optionsContainer = document.getElementById('optionsContainer');
    const optionsBtns = document.querySelectorAll('.btn-option');
    const typingContainer = document.getElementById('typingContainer');
    const typeInput = document.getElementById('typeInput');
    const typeSubmitBtn = document.getElementById('typeSubmitBtn');
    const nextBtn = document.getElementById('nextBtn');
    const restartBtn = document.getElementById('restartBtn');
    const saveBtn = document.getElementById('saveBtn');
    const speakBtn = document.getElementById('speakBtn');
    const exampleArea = document.getElementById('exampleArea');
    const exampleTextDOM = document.getElementById('exampleText');
    const speakExBtn = document.getElementById('speakExBtn');
    const shadowBtn = document.getElementById('shadowBtn');
    const quizCard = document.getElementById('quizCard');

    // 이벤트 리스너 등록
    daySelect.addEventListener('change', () => { isReviewTestMode = false; resetAndLoad(); });
    modeSelect.addEventListener('change', resetAndLoad);
    saveBtn.addEventListener('click', () => saveToReview(currentWord.eng, currentWord.kor, false));
    speakBtn.addEventListener('click', () => speakText(currentWord.eng));
    speakExBtn.addEventListener('click', () => speakText(currentExampleEng));
    shadowBtn.addEventListener('click', toggleShadowing);
    
    // 엔터키 입력 처리
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            if (!isQuestionResolved && modeSelect.value === 'ko2en_type' && document.activeElement === typeInput) {
                checkAnswerTyping();
            } else if (isQuestionResolved && nextBtn.style.display === 'block') {
                nextQuestion();
            }
        }
    });

    // 초기화 및 세션 로드 (일반 모드 또는 오답 테스트 모드 분기)
    function resetAndLoad() {
        let pool = [];
        
        if (isReviewTestMode) {
            // 오답 테스트 모드일 경우: 로컬스토리지에서 오답 리스트 가져오기
            let savedWords = JSON.parse(localStorage.getItem('myVocaReview') || '[]');
            if(savedWords.length === 0) {
                alert("저장된 오답이 없습니다. 일반 모드로 돌아갑니다.");
                isReviewTestMode = false;
                resetAndLoad();
                return;
            }
            pool = savedWords.map(w => ({ eng: w.eng, kor: w.kor, day: "REVIEW" }));
            daySelect.value = "전체 랜덤"; // 오답모드일땐 Day 선택 무효화 느낌 부여
        } else {
            // 일반 모드일 경우
            const day = daySelect.value;
            if (day === '전체 랜덤') {
                pool = [...allWords];
            } else {
                pool = allWords.filter(w => w.day === day);
            }
        }
        
        // 단어 리스트 무작위 섞기 (Fisher-Yates Shuffle)
        for (let i = pool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [pool[i], pool[j]] = [pool[j], pool[i]];
        }
        
        sessionQueue = pool;
        totalSessionWords = sessionQueue.length;
        completedWords = 0;
        score = 0;
        
        restartBtn.style.display = 'none';
        quizCard.style.display = 'block';
        updateScoreBoard();
        nextQuestion();
    }

    function updateScoreBoard() {
        let prefix = isReviewTestMode ? "[오답 복습] " : "";
        progressText.textContent = `${prefix}진행: ${completedWords} / ${totalSessionWords}`;
        remainText.textContent = `남은 단어: ${sessionQueue.length}`;
        scoreText.textContent = `점수: ${score}`;
    }

    function nextQuestion() {
        if (sessionQueue.length === 0) {
            // 모든 단어 학습 완료
            quizCard.style.display = 'none';
            optionsContainer.style.display = 'none';
            typingContainer.style.display = 'none';
            exampleArea.style.display = 'none';
            feedbackLabel.innerHTML = isReviewTestMode ? "🎉 오답 복습을 모두 완료했습니다! 대단해요!" : "🎉 선택한 Day의 모든 단어를 학습했습니다!";
            feedbackLabel.style.color = "#27ae60";
            nextBtn.style.display = 'none';
            restartBtn.style.display = 'block';
            isReviewTestMode = false; // 끝나면 오답 모드 해제
            return;
        }
        
        isQuestionResolved = false;
        currentWord = sessionQueue.pop(); 
        const mode = modeSelect.value;
        
        // UI 초기화
        nextBtn.style.display = 'none';
        feedbackLabel.textContent = '';
        exampleArea.style.display = 'none';
        exampleTextDOM.innerHTML = '';
        currentExampleEng = "";
        
        // 오답테스트 중일땐 이미 저장된 단어이므로 '저장됨' 표시
        if (isReviewTestMode) {
            saveBtn.textContent = '저장된 오답';
            saveBtn.disabled = true;
        } else {
            saveBtn.textContent = '⭐ 오답 저장';
            saveBtn.disabled = false;
        }
        speakBtn.disabled = false;
        
        // 모드별 화면 구성 설정
        if (mode === 'ko2en_type') {
            optionsContainer.style.display = 'none';
            typingContainer.style.display = 'flex';
            typeInput.value = '';
            typeInput.disabled = false;
            typeInput.className = 'type-input';
            typeSubmitBtn.disabled = false;
            typeInput.focus();
            
            questionLabel.textContent = currentWord.kor;
            currentAnswer = currentWord.eng;
            speakBtn.disabled = true; 
        } else {
            optionsContainer.style.display = 'flex';
            typingContainer.style.display = 'none';
            optionsBtns.forEach(btn => {
                btn.className = 'btn-option';
                btn.disabled = false;
            });
            
            let allAnswersPool = [];
            if (mode === 'en2ko') {
                questionLabel.textContent = currentWord.eng;
                currentAnswer = currentWord.kor;
                allAnswersPool = allWords.map(w => w.kor);
            } else {
                questionLabel.textContent = currentWord.kor;
                currentAnswer = currentWord.eng;
                speakBtn.disabled = true;
                allAnswersPool = allWords.map(w => w.eng);
            }

            // 보기 4개 생성 (전체 DB에서 랜덤 추출)
            let options = [currentAnswer];
            while (options.length < 4) {
                let wrong = allAnswersPool[Math.floor(Math.random() * allAnswersPool.length)];
                if (!options.includes(wrong)) options.push(wrong);
            }
            options.sort(() => Math.random() - 0.5); 
            optionsBtns.forEach((btn, index) => {
                btn.textContent = options[index];
            });
        }
    }

    function checkAnswerChoice(clickedBtn) {
        optionsBtns.forEach(btn => btn.disabled = true);
        const isCorrect = (clickedBtn.textContent === currentAnswer);
        processResult(isCorrect, clickedBtn);
    }

    function checkAnswerTyping() {
        const userText = typeInput.value.trim().toLowerCase();
        if (userText === '') return;
        
        typeInput.disabled = true;
        typeSubmitBtn.disabled = true;
        const isCorrect = (userText === currentAnswer.toLowerCase());
        
        processResult(isCorrect, null);
    }

    function processResult(isCorrect, clickedBtn) {
        isQuestionResolved = true;
        completedWords++;
        
        if (isCorrect) {
            score += 10;
            feedbackLabel.textContent = "정답입니다! 🎉";
            feedbackLabel.style.color = "#27ae60";
            if(clickedBtn) clickedBtn.classList.add('correct');
            else typeInput.classList.add('correct');
            speakText(currentWord.eng);
            
            // 오답 테스트 중에 맞췄다면? (삭제 유도 등의 로직 가능. 여기선 유지)
        } else {
            feedbackLabel.innerHTML = `땡! 정답은: <span style="text-decoration: underline;">${currentAnswer}</span>`;
            feedbackLabel.style.color = "#c0392b";
            if(clickedBtn) {
                clickedBtn.classList.add('wrong');
                optionsBtns.forEach(btn => { if (btn.textContent === currentAnswer) btn.classList.add('correct'); });
            } else {
                typeInput.classList.add('wrong');
            }
            if(!isReviewTestMode) saveToReview(currentWord.eng, currentWord.kor, true); 
        }
        
        updateScoreBoard();
        fetchExample(currentWord.eng);
        nextBtn.style.display = 'block';
    }

    // 예문 API 호출
    async function fetchExample(word) {
        exampleArea.style.display = 'flex';
        exampleTextDOM.innerHTML = "📝 예문과 해석을 불러오는 중...";
        speakExBtn.disabled = true;
        shadowBtn.disabled = true;
        
        try {
            const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word.toLowerCase()}`);
            if (!res.ok) throw new Error("Not found");
            const data = await res.json();
            
            let engSentence = "";
            for (let meaning of data[0].meanings) {
                for (let def of meaning.definitions) {
                    if (def.example) {
                        engSentence = def.example;
                        break;
                    }
                }
                if (engSentence) break;
            }
            
            if (engSentence) {
                currentExampleEng = engSentence;
                const transRes = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(engSentence)}&langpair=en|ko`);
                const transData = await transRes.json();
                let korSentence = transData.responseData.translatedText;
                
                exampleTextDOM.innerHTML = `<strong>💡 예문:</strong> ${engSentence}<br><br><strong>🇰🇷 해석:</strong> ${korSentence}`;
                speakExBtn.disabled = false;
                shadowBtn.disabled = false;
            } else {
                exampleTextDOM.innerHTML = "💡 이 단어는 등록된 예문이 없습니다.";
            }
        } catch (error) {
            exampleTextDOM.innerHTML = "💡 예문을 찾을 수 없거나 인터넷 연결 문제가 있습니다.";
        }
    }

    // ==========================================
    // 오답 노트(Review) 관련 함수들
    // ==========================================
    function saveToReview(eng, kor, isAuto) {
        let savedWords = JSON.parse(localStorage.getItem('myVocaReview') || '[]');
        let exists = savedWords.find(w => w.eng === eng);
        
        if (exists) {
            if (!isAuto) saveBtn.textContent = '이미 저장됨';
        } else {
            savedWords.push({ eng, kor, date: new Date().getTime() });
            localStorage.setItem('myVocaReview', JSON.stringify(savedWords));
            saveBtn.textContent = isAuto ? '자동 저장됨' : '✅ 저장 완료';
        }
        saveBtn.disabled = true;
    }

    function openReviewModal() {
        const modal = document.getElementById('reviewModal');
        const listDiv = document.getElementById('reviewList');
        const countText = document.getElementById('reviewCountText');
        const startTestBtn = document.getElementById('startReviewTestBtn');
        
        let savedWords = JSON.parse(localStorage.getItem('myVocaReview') || '[]');
        savedWords.sort((a, b) => b.date - a.date);
        
        countText.textContent = `총 ${savedWords.length} 단어`;
        
        listDiv.innerHTML = '';
        if (savedWords.length === 0) {
            listDiv.innerHTML = '<div class="empty-msg">저장된 오답이 없습니다.<br>문제를 풀며 틀린 단어가 이곳에 쌓입니다.</div>';
            startTestBtn.style.display = 'none'; // 오답이 없으면 테스트 버튼 숨김
        } else {
            startTestBtn.style.display = 'block'; // 오답이 있으면 테스트 버튼 표시
            savedWords.forEach((word, index) => {
                const item = document.createElement('div');
                item.className = 'review-item';
                item.innerHTML = `
                    <div class="review-word-box">
                        <span class="review-eng">${word.eng}</span>
                        <span class="review-kor">${word.kor}</span>
                    </div>
                    <button class="btn-delete-review" onclick="deleteReviewWord('${word.eng}')">삭제</button>
                `;
                listDiv.appendChild(item);
            });
        }
        modal.style.display = 'flex';
    }

    function closeReviewModal() {
        document.getElementById('reviewModal').style.display = 'none';
    }

    function deleteReviewWord(eng) {
        let savedWords = JSON.parse(localStorage.getItem('myVocaReview') || '[]');
        savedWords = savedWords.filter(w => w.eng !== eng);
        localStorage.setItem('myVocaReview', JSON.stringify(savedWords));
        openReviewModal(); // 리스트 새로고침
    }
    
    // ⭐ 오답 테스트 시작 함수
    function startReviewTest() {
        closeReviewModal();
        isReviewTestMode = true; // 오답 모드 ON
        resetAndLoad(); // 오답 데이터를 기반으로 세션 시작
    }

    // 모달 바깥 영역 클릭시 닫기
    window.onclick = function(event) {
        const modal = document.getElementById('reviewModal');
        if (event.target === modal) {
            closeReviewModal();
        }
    }

    // TTS 및 STT
    function speakText(text) {
        if (!text) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        window.speechSynthesis.speak(utterance);
    }

    let recognition;
    let isRecording = false;
    if ('webkitSpeechRecognition' in window) {
        recognition = new webkitSpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'en-US';
        recognition.onresult = function(event) { analyzeSpeech(event.results[0][0].transcript); resetShadowBtn(); };
        recognition.onerror = function(event) { alert("마이크 인식 오류. 권한을 확인해주세요."); resetShadowBtn(); };
        recognition.onend = resetShadowBtn;
    }

    function toggleShadowing() {
        if (!recognition) { alert("이 브라우저는 음성 인식을 지원하지 않습니다. Chrome을 이용해주세요."); return; }
        if (isRecording) { recognition.stop(); } 
        else {
            isRecording = true;
            shadowBtn.textContent = '🛑';
            exampleTextDOM.innerHTML = `<strong>🔴 [녹음 중]</strong> 원어민 발음을 듣고 따라 말한 뒤 🛑 버튼을 누르세요!`;
            speakText(currentExampleEng);
            setTimeout(() => recognition.start(), 500);
        }
    }
    function resetShadowBtn() { isRecording = false; shadowBtn.textContent = '🎙'; }

    function analyzeSpeech(userText) {
        const cleanTarget = currentExampleEng.toLowerCase().replace(/[^a-z0-9 ]/g, '');
        const cleanUser = userText.toLowerCase().replace(/[^a-z0-9 ]/g, '');
        let ratio = getSimilarity(cleanTarget, cleanUser);
        let score = Math.round(ratio * 100);
        let msg = score >= 80 ? `🎉 완벽해요! (일치율: ${score}%)\n\n[내 발음]\n${userText}` : `💪 조금 더 연습해봐요! (일치율: ${score}%)\n\n[내 발음]\n${userText}`;
        alert(msg);
        fetchExample(currentWord.eng); 
    }

    function getSimilarity(s1, s2) {
        let longer = s1, shorter = s2;
        if (s1.length < s2.length) { longer = s2; shorter = s1; }
        let longerLength = longer.length;
        if (longerLength == 0) return 1.0;
        let editDistance = getEditDistance(longer, shorter);
        return (longerLength - editDistance) / parseFloat(longerLength);
    }
    function getEditDistance(s1, s2) {
        let costs = [];
        for (let i = 0; i <= s1.length; i++) {
            let lastValue = i;
            for (let j = 0; j <= s2.length; j++) {
                if (i == 0) costs[j] = j;
                else {
                    if (j > 0) {
                        let newValue = costs[j - 1];
                        if (s1.charAt(i - 1) != s2.charAt(j - 1)) newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                        costs[j - 1] = lastValue; lastValue = newValue;
                    }
                }
            }
            if (i > 0) costs[s2.length] = lastValue;
        }
        return costs[s2.length];
    }

    // 시작
    resetAndLoad();

</script>
